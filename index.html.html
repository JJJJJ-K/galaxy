<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Galaxy of Love</title>
<style>
:root{--bg:#05000a;--ink:#fff0f6;--pink:#ff4d94;--soft:#ff9ecb;--panel:#14061c;box-sizing:border-box;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:Georgia,"Times New Roman",serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;padding:24px 24px calc(14vh + env(safe-area-inset-bottom,0px));text-align:center;transition:opacity 1.2s ease;z-index:5;background:radial-gradient(ellipse at center,transparent 25%,rgba(5,0,10,.7) 100%)}
#intro.gone{opacity:0;pointer-events:none}
#intro h1{margin:0;font-size:clamp(28px,8vw,48px);font-weight:400;font-style:italic;letter-spacing:.01em;text-shadow:0 0 24px rgba(255,77,148,.7)}
#intro p{margin:0;color:var(--soft);font-size:15px}
.btn{font:inherit;color:var(--ink);background:linear-gradient(135deg,#ff4d94,#c2188a);border:0;border-radius:999px;padding:14px 32px;font-size:18px;cursor:pointer;box-shadow:0 0 28px rgba(255,77,148,.55);animation:pulse 2.4s ease-in-out infinite}
.btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid #fff;outline-offset:2px}
@keyframes pulse{50%{box-shadow:0 0 46px rgba(255,77,148,.9);transform:scale(1.03)}}
#hint{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--soft);font-size:14px;opacity:0;transition:opacity 1.5s;pointer-events:none}
#hint.on{opacity:.85}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,0,10,.72);padding:16px;z-index:10}
#modal.open{display:flex}
.card{width:100%;max-width:440px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid rgba(255,120,180,.35);border-radius:18px;padding:18px;box-shadow:0 0 50px rgba(255,77,148,.3);}
.card input[type=text],.card textarea{width:100%;font:inherit;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:10px;margin-bottom:10px}
.card input[type=text]{font-size:20px;font-style:italic}
.card textarea{min-height:110px;resize:vertical;font-size:16px;line-height:1.5}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.add{display:inline-block;color:var(--soft);border:1px dashed var(--soft);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:15px}
.add input{position:absolute;opacity:0;width:1px;height:1px}
.done{font:inherit;background:var(--pink);color:#fff;border:0;border-radius:10px;padding:10px 20px;font-size:16px;cursor:pointer}
.cust{justify-content:flex-start;margin-bottom:10px;flex-wrap:wrap}
.card .cust input#picon{width:58px;margin:0;text-align:center;font-size:24px;font-style:normal;padding:6px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw button.on{border-color:#fff}
.rg{color:var(--soft);font-size:15px;display:flex;gap:6px;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.grid div{position:relative}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.grid button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="intro">
  <h1>A Galaxy of Love</h1>
  <p>made just for you</p>
  <button class="btn" id="enter">Enter my universe</button>
</div>
<div id="hint">Swipe to turn the galaxy · tap a planet</div>
<div id="modal" role="dialog" aria-modal="true" aria-label="Planet">
  <div class="card">
    <input type="text" id="pname" maxlength="28" aria-label="Planet name">
    <div class="row cust">
      <input type="text" id="picon" maxlength="8" aria-label="Planet icon (emoji)" placeholder="🙂">
      <div class="sw" id="sw" role="group" aria-label="Planet color"></div>
      <label class="rg"><input type="checkbox" id="pring"> Ring</label>
    </div>
    <textarea id="pmsg" placeholder="Write your message here…" aria-label="Message"></textarea>
    <div class="row">
      <label class="add">+ Add photos<input type="file" id="pimg" accept="image/*" multiple></label>
      <button class="done" id="close">Done</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)/1.5;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

let W,H,F,DPR,sc,bw,bh,buf,buf32,bimg,bcv,bctx,starLayer;
function resize(){
  DPR=Math.min(1.5,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;F=Math.min(W,H)*1.1+Math.max(W,H)*.1;
  // galaxy is rendered into a small pixel buffer, then scaled up (fast + soft glow)
  sc=Math.max(.5,Math.min(.75,700/Math.max(W,H)));
  bw=Math.ceil(W*sc);bh=Math.ceil(H*sc);
  bcv=mk(bw,bh);bctx=bcv.getContext('2d');bimg=bctx.createImageData(bw,bh);
  buf=bimg.data;buf32=new Uint32Array(buf.buffer);
  starLayer=mk(W,H);const sg=starLayer.getContext('2d');sg.fillStyle='#ffe6f2';
  for(let i=0;i<260;i++){sg.globalAlpha=rnd(.05,.2);sg.beginPath();sg.arc(Math.random()*W,Math.random()*H,rnd(.4,1.1),0,7);sg.fill()}
}
addEventListener('resize',resize);

// ---------- Galaxy particles (typed arrays) ----------
const R=300,N=10000;
const gR=new Float32Array(N),gA=new Float32Array(N),gW=new Float32Array(N),gY=new Float32Array(N),gS=new Float32Array(N);
const cR=new Uint8Array(N),cG=new Uint8Array(N),cB=new Uint8Array(N);
function hsl(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return[f(0)*255,f(8)*255,f(4)*255]}
for(let i=0;i<N;i++){
  const dust=i%7===0,arm=i%3;
  let r=Math.pow(Math.random(),.85)*R*(dust?1.2:1)+14;
  if(!dust)r=Math.max(10,r+gauss()*28);
  const t=Math.min(1,r/(R*1.2)),spread=dust?Math.PI:(1.05-.3*t),fade=Math.pow(1-t,1.25);
  gR[i]=r;gA[i]=dust?rnd(0,Math.PI*2):r*.021+arm*Math.PI*2/3+gauss()*spread;
  gW[i]=1.6/(r+40)*14;gY[i]=gauss()*((dust?60:40)*Math.pow(1-t,1.2)+12);gS[i]=rnd(1,dust?2.2:3.2);
  const al=rnd(.35,.95)*fade+.02,c=hsl(rnd(310,345),95-t*10,92-t*40);
  cR[i]=c[0]*al;cG[i]=c[1]*al;cB[i]=c[2]*al;
}

// ---------- Sprites ----------
const HEART=new Path2D();
HEART.moveTo(0,-.3);HEART.bezierCurveTo(0,-.95,-1,-.95,-1,-.3);HEART.bezierCurveTo(-1,.3,-.3,.6,0,1);
HEART.bezierCurveTo(.3,.6,1,.3,1,-.3);HEART.bezierCurveTo(1,-.95,0,-.95,0,-.3);
const heartSp=['#ff4d94','#ff9ecb','#ffffff','#ff2e7e','#ffc2dd'].map(c=>{
  const k=mk(64,64),g=k.getContext('2d');g.translate(32,32);g.scale(28,28);g.fillStyle=c;g.fill(HEART);return k});
function radial(size,stops){const k=mk(size,size),g=k.getContext('2d'),h=size/2,r=g.createRadialGradient(h,h,0,h,h,h);
  stops.forEach(([o,c])=>r.addColorStop(o,c));g.fillStyle=r;g.fillRect(0,0,size,size);return k}
const bgGlow=radial(256,[[0,'rgba(255,90,170,.35)'],[.5,'rgba(150,20,110,.12)'],[1,'rgba(0,0,0,0)']]);
const coreGlow=radial(128,[[0,'rgba(255,240,250,.95)'],[.4,'rgba(255,120,190,.45)'],[1,'rgba(255,60,150,0)']]);

const PAL=[['#ffb86b','#e0527a'],['#ff7eb6','#a8206e'],['#9ad0ff','#5b4fd1'],['#b6ffcf','#1fa37a'],['#ffe27a','#e0782f'],['#d9a8ff','#7a2fd0'],['#ffffff','#8a8aa0'],['#ff6b6b','#8a1c2c']];
const ICONS=['💖','💌','✨','🎵','💍','🚀'];
function planetSprite(p){
  const key=p.data.icon+'|'+p.data.col+'|'+p.data.ring;
  if(p.key===key)return p.spr;
  p.key=key;const k=p.spr=mk(160,160),g=k.getContext('2d'),pal=PAL[p.data.col%PAL.length],r=40;
  const gl=g.createRadialGradient(80,80,r*.8,80,80,80);gl.addColorStop(0,'rgba(255,150,200,.35)');gl.addColorStop(1,'rgba(255,150,200,0)');
  g.fillStyle=gl;g.fillRect(0,0,160,160);
  const ring=h=>{g.strokeStyle=h?'rgba(255,220,240,.9)':'rgba(255,220,240,.7)';g.lineWidth=6;g.beginPath();g.ellipse(80,80,r*1.8,r*.5,-.35,h?0:Math.PI,h?Math.PI:Math.PI*2);g.stroke()};
  if(p.data.ring)ring(false);
  const sg=g.createRadialGradient(80-r*.35,80-r*.4,r*.1,80,80,r);sg.addColorStop(0,pal[0]);sg.addColorStop(1,pal[1]);
  g.fillStyle=sg;g.beginPath();g.arc(80,80,r,0,7);g.fill();
  if(p.data.icon){g.font='54px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(p.data.icon,80,82)}
  if(p.data.ring)ring(true);
  return k;
}

// ---------- Planets (they live on the spiral arms, same maths as the particles) ----------
const defs=[['Our Memories',95,1],['Love Letter',130,0],['Dreams',165,1],['Favorite Songs',200,0],['Promises',235,1],['Next Adventure',270,0]];
let saved=[];try{saved=JSON.parse(localStorage.getItem('galaxy-love-v1')||'[]')}catch(e){}
const planets=defs.map((d,i)=>({
  r:d[1],arm:i%3,a0:d[1]*.021+(i%3)*Math.PI*2/3+gauss()*.25,w:1.6/(d[1]+40)*14,size:40,shade:1,
  data:Object.assign({name:d[0],msg:'',imgs:[],icon:ICONS[i],col:i,ring:!!d[2]},saved[i]||{}),sx:0,sy:0,sr:0,d:0,key:'',spr:null}));
function persist(){try{localStorage.setItem('galaxy-love-v1',JSON.stringify(planets.map(p=>p.data)))}catch(e){}}

// ---------- Hearts ----------
const hearts=Array.from({length:150},()=>spawn(rnd(60,2600)));
function spawn(z){const a=rnd(0,Math.PI*2),d=rnd(170,1700);return{x:Math.cos(a)*d,y:Math.sin(a)*d,z,s:rnd(14,34),c:(Math.random()*5)|0}}

// ---------- State ----------
let cyFrac=.5,yaw=0,yawV=0,drag=null,closing=false,phase='intro',t0=0,time=0,D=3300,tilt=.3,hSpeed=260,pAlpha=0,last=performance.now();
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2,WARP=7000;
resize();

function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  time+=reduce?dt*.4:dt;
  if(phase==='warp'){
    const u=Math.min(1,(now-t0)/WARP),e=ease(u);
    D=3300+(800-3300)*e;cyFrac=.5+.1*e;tilt=.3+(.38-.3)*e;
    hSpeed=260+1900*Math.sin(Math.PI*Math.min(1,u*1.05));
    pAlpha=Math.max(0,(u-.65)/.35);
    if(u>=1){phase='explore';hSpeed=240;pAlpha=1;const h=$('hint');h.classList.add('on');setTimeout(()=>h.classList.remove('on'),5000)}
  }
  if(!drag||!drag.moved){yaw+=yawV;yawV*=.95}
  draw(dt);requestAnimationFrame(frame);
}

function draw(dt){
  const ct=Math.cos(tilt),st=Math.sin(tilt);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.fillStyle='#05000a';ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.85+.15*Math.sin(time*.7);ctx.drawImage(starLayer,0,0);ctx.globalAlpha=1;
  const cx=W/2,cy=H*cyFrac,ck=F/D;                    // galaxy centre on screen
  const bgR=R*ck*1.4;ctx.drawImage(bgGlow,cx-bgR,cy-bgR,bgR*2,bgR*2);

  // planets: positioned by the very same projection as the particles
  const back=[],front=[];
  if(pAlpha>0){
    for(const p of planets){
      const a=p.a0+time*p.w+yaw,x=Math.cos(a)*p.r,z=Math.sin(a)*p.r;
      const dd=z*ct+D,k=F/dd,ratio=k/ck;
      p.sx=cx+x*k;p.sy=cy+(-z*st)*k;p.d=dd;
      p.sr=p.size*k*Math.max(.5,Math.min(1.15,Math.pow(ratio,2)));
      p.shade=Math.max(.45,Math.min(1,.7+(ratio-1)*3));
      (dd>D?back:front).push(p);
    }
    back.sort((a,b)=>b.d-a.d);front.sort((a,b)=>b.d-a.d);
    for(const p of back)drawPlanet(p);
  }

  // particles -> pixel buffer (additive)
  buf32.fill(0xFF000000);
  for(let i=0;i<N;i++){
    const a=gA[i]+time*gW[i]+yaw,r=gR[i],y=gY[i],z=Math.sin(a)*r;
    const d=y*st+z*ct+D;if(d<20)continue;
    const k=F/d,px=((cx+Math.cos(a)*r*k)*sc)|0,py=((cy+(y*ct-z*st)*k)*sc)|0;
    const s=Math.max(1,Math.round(gS[i]*k*2.4*sc));
    const x1=Math.min(bw,px+s),y1=Math.min(bh,py+s),r8=cR[i],g8=cG[i],b8=cB[i];
    for(let yy=Math.max(0,py);yy<y1;yy++){let o=(yy*bw+Math.max(0,px))*4;
      for(let xx=Math.max(0,px);xx<x1;xx++,o+=4){buf[o]+=r8;buf[o+1]+=g8;buf[o+2]+=b8}}
  }
  bctx.putImageData(bimg,0,0);
  ctx.globalCompositeOperation='lighter';ctx.imageSmoothingEnabled=true;
  ctx.drawImage(bcv,0,0,W,H);
  const cr=60*ck;ctx.drawImage(coreGlow,cx-cr,cy-cr,cr*2,cr*2);
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#05000a';ctx.beginPath();ctx.ellipse(cx,cy,16*ck,16*ck*st,0,0,7);ctx.fill();
  for(const p of front)drawPlanet(p);

  // hearts
  const am=phase==='explore'?.4:.9;
  for(let i=0;i<hearts.length;i++){
    const h=hearts[i];h.z-=hSpeed*dt;
    if(h.z<40){hearts[i]=spawn(rnd(2300,2700));continue}
    const k=F/h.z,x=cx+h.x*k,y=H/2+h.y*k,s=h.s*k;
    if(x<-s*2||x>W+s*2||y<-s*2||y>H+s*2){if(h.z<600)hearts[i]=spawn(rnd(2300,2700));continue}
    ctx.globalAlpha=am*Math.min(1,h.z/250)*Math.min(1,(2700-h.z)/300);
    const q=s*64/28;ctx.drawImage(heartSp[h.c],x-q/2,y-q/2,q,q);
  }
  ctx.globalAlpha=1;
}

function drawPlanet(p){
  const spr=planetSprite(p),q=p.sr/40*160,x=p.sx,y=p.sy,r=p.sr;
  ctx.globalAlpha=pAlpha*p.shade;
  ctx.drawImage(spr,x-q/2,y-q/2,q,q);
  if(p.data.msg||p.data.imgs.length){const b=r*.9;ctx.drawImage(heartSp[2],x+r*.6,y-r*1.4,b,b)}
  ctx.fillStyle='rgba(255,235,245,.92)';ctx.font=`italic ${Math.max(10,Math.min(14,r*.5))}px Georgia,serif`;ctx.textAlign='center';
  ctx.fillText(p.data.name,x,y+r*1.5+10);
  ctx.globalAlpha=1;
}

$('enter').addEventListener('click',()=>{$('intro').classList.add('gone');phase='warp';t0=performance.now()});

// ---------- Swipe + tap ----------
let cur=null;
cv.addEventListener('pointerdown',e=>{
  if(phase!=='explore'||closing)return;
  drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:false};
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8)drag.moved=true;
  if(drag.moved){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;yaw+=dx*.008;yawV=dx*.008;tilt=Math.max(.12,Math.min(1.25,tilt+dy*.004))}
  drag.x=e.clientX;drag.y=e.clientY;
});
function endDrag(e,cancel){
  if(!drag)return;const d=drag;drag=null;if(d.moved||cancel)return;
  let best=null,bd=1e9;
  for(const p of planets){const dd=Math.hypot(e.clientX-p.sx,e.clientY-p.sy);if(dd<p.sr+18&&dd<bd){best=p;bd=dd}}
  if(best)openPlanet(best);
}
cv.addEventListener('pointerup',e=>endDrag(e,false));
cv.addEventListener('pointercancel',e=>endDrag(e,true));

// ---------- Planet card ----------
function openPlanet(p){
  cur=p;$('pname').value=p.data.name;$('pmsg').value=p.data.msg;
  $('picon').value=p.data.icon||'';$('pring').checked=!!p.data.ring;renderSw();renderGrid();
  $('modal').classList.add('open');
  const card=document.querySelector('.card'),r=card.getBoundingClientRect(),ms=reduce?0:1;
  const dx=p.sx-(r.left+r.width/2),dy=p.sy-(r.top+r.height/2);
  $('modal').animate([{opacity:0},{opacity:1}],{duration:320*ms});
  card.animate([{transform:`translate(${dx}px,${dy}px) scale(.04)`,opacity:0},{opacity:1,offset:.35},{transform:'none',opacity:1}],{duration:560*ms,easing:'cubic-bezier(.2,.85,.25,1)'});
}
function renderGrid(){
  const g=$('grid');g.innerHTML='';
  cur.data.imgs.forEach((src,i)=>{
    const d=document.createElement('div'),im=document.createElement('img'),b=document.createElement('button');
    im.src=src;im.alt='Photo '+(i+1);b.textContent='×';b.setAttribute('aria-label','Remove photo');
    b.onclick=()=>{cur.data.imgs.splice(i,1);persist();renderGrid()};d.append(im,b);g.append(d);
  });
}
function renderSw(){
  const w=$('sw');w.innerHTML='';
  PAL.forEach((c,i)=>{const b=document.createElement('button');
    b.style.background=`linear-gradient(135deg,${c[0]},${c[1]})`;b.setAttribute('aria-label','Color '+(i+1));
    if(cur.data.col===i)b.className='on';b.onclick=()=>{cur.data.col=i;persist();renderSw()};w.append(b)});
}
$('picon').oninput=e=>{cur.data.icon=Array.from(e.target.value).slice(-1)[0]||'';e.target.value=cur.data.icon;persist()};
$('pring').onchange=e=>{cur.data.ring=e.target.checked;persist()};
$('pname').oninput=e=>{cur.data.name=e.target.value||'Planet';persist()};
$('pmsg').oninput=e=>{cur.data.msg=e.target.value;persist()};
$('pimg').onchange=e=>{
  for(const f of e.target.files){
    const rd=new FileReader();
    rd.onload=()=>{const im=new Image();im.onload=()=>{
      const m=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=im.width*m;c.height=im.height*m;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      cur.data.imgs.push(c.toDataURL('image/jpeg',.8));persist();renderGrid();
    };im.src=rd.result};
    rd.readAsDataURL(f);
  }
  e.target.value='';
};
function closeModal(){
  if(!cur||closing)return;closing=true;
  const p=cur,card=document.querySelector('.card'),r=card.getBoundingClientRect(),ms=reduce?0:1;
  const dx=p.sx-(r.left+r.width/2),dy=p.sy-(r.top+r.height/2);
  $('modal').animate([{opacity:1},{opacity:0}],{duration:360*ms,fill:'forwards'});
  const an=card.animate([{transform:'none',opacity:1},{opacity:0,offset:.7},{transform:`translate(${dx}px,${dy}px) scale(.04)`,opacity:0}],{duration:380*ms,easing:'cubic-bezier(.6,0,.8,.4)',fill:'forwards'});
  an.onfinish=()=>{$('modal').getAnimations().forEach(x=>x.cancel());card.getAnimations().forEach(x=>x.cancel());$('modal').classList.remove('open');cur=null;closing=false};
}
$('close').onclick=closeModal;
$('modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal')closeModal()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
requestAnimationFrame(frame);
</script>
</body>
</html>
