<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Galaxy of Love</title>
<style>
:root{--bg:#05000a;--ink:#fff0f6;--pink:#ff4d94;--soft:#ff9ecb;--panel:#14061c;box-sizing:border-box;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:Georgia,"Times New Roman",serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#intro{position:fixed;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:calc(6vh + env(safe-area-inset-top,0px)) 24px 0;text-align:center;transition:opacity 1s ease;z-index:5;pointer-events:none}
#intro.gone{opacity:0}
#intro h1{margin:0;font-size:clamp(28px,8vw,48px);font-weight:400;font-style:italic;text-shadow:0 0 24px rgba(255,77,148,.7)}
#intro p{margin:0;color:var(--soft);font-size:15px;animation:fl 2.6s ease-in-out infinite}
@keyframes fl{50%{opacity:.55}}
#hint{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--soft);font-size:14px;opacity:0;transition:opacity 1.5s;pointer-events:none}
#hint.on{opacity:.85}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,0,10,.72);padding:16px;z-index:10;backdrop-filter:blur(4px)}
#modal.open{display:flex}
.card{width:100%;max-width:440px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid rgba(255,120,180,.35);border-radius:18px;padding:18px;box-shadow:0 0 50px rgba(255,77,148,.3)}
.card input:focus-visible,.card textarea:focus-visible,button:focus-visible,label:focus-within{outline:2px solid #fff;outline-offset:2px}
.card input[type=text],.card textarea{width:100%;font:inherit;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:10px;margin-bottom:10px}
.card input[type=text]{font-size:20px;font-style:italic}
.card textarea{min-height:110px;resize:vertical;font-size:16px;line-height:1.5}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.add{display:inline-block;color:var(--soft);border:1px dashed var(--soft);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:15px}
.add input{position:absolute;opacity:0;width:1px;height:1px}
.done{font:inherit;background:var(--pink);color:#fff;border:0;border-radius:10px;padding:10px 20px;font-size:16px;cursor:pointer}
.cust{justify-content:flex-start;margin-bottom:10px;flex-wrap:wrap}
.card .cust input#picon{width:58px;margin:0;text-align:center;font-size:24px;font-style:normal;padding:6px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw button.on{border-color:#fff}
.rg{color:var(--soft);font-size:15px;display:flex;gap:6px;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.grid div{position:relative}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.grid button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="intro">
  <h1>A Galaxy of Love</h1>
  <p id="msg">Pull the bow back, aim at the balloon, let go</p>
</div>
<div id="hint">Swipe to turn the galaxy · tap a planet</div>
<div id="modal" role="dialog" aria-modal="true" aria-label="Planet">
  <div class="card">
    <input type="text" id="pname" maxlength="28" aria-label="Planet name">
    <div class="row cust">
      <input type="text" id="picon" maxlength="8" aria-label="Planet icon (emoji)" placeholder="🙂">
      <div class="sw" id="sw" role="group" aria-label="Planet color"></div>
      <label class="rg"><input type="checkbox" id="pring"> Ring</label>
    </div>
    <textarea id="pmsg" placeholder="Write your message here…" aria-label="Message"></textarea>
    <div class="row">
      <label class="add">+ Add photos<input type="file" id="pimg" accept="image/*" multiple></label>
      <button class="done" id="close">Done</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)/1.5;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

let W,H,F,DPR,sc,bw,bh,buf,buf32,bimg,bcv,bctx,starLayer,vig,tw=[],bx,by,bR;
const L=120,G=700;

// ---------- Procedural nebula (fbm noise, rendered once) ----------
const hash=(x,y)=>{const h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h)};
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return(hash(xi,yi)*(1-u)+hash(xi+1,yi)*u)*(1-v)+(hash(xi,yi+1)*(1-u)+hash(xi+1,yi+1)*u)*v}
function fbm(x,y){let s=0,a=.5;for(let i=0;i<5;i++){s+=a*vn(x,y);x=x*2.03+17;y=y*2.03+9;a*=.5}return s}
const nebula=(()=>{const S=200,k=mk(S,S),g=k.getContext('2d'),im=g.createImageData(S,S),d=im.data;
  for(let py=0;py<S;py++)for(let px=0;px<S;px++){
    const x=px/S*3.4,y=py/S*3.4,n=fbm(x,y),m=fbm(x+7.3,y+2.1),bd=py/S-(.2+.55*px/S),band=Math.exp(-bd*bd*16);
    const v=Math.max(0,n*1.3-.42)*(.3+band*1.4),o=(py*S+px)*4;
    d[o]=v*(110+m*130)*.75;d[o+1]=v*(14+m*36)*.75;d[o+2]=v*(140-m*40)*.75;d[o+3]=255}
  g.putImageData(im,0,0);return k})();

function resize(){
  DPR=Math.min(1.5,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;F=Math.min(W,H)*1.1+Math.max(W,H)*.1;
  sc=Math.max(.6,Math.min(.9,900/Math.max(W,H)));
  bw=Math.ceil(W*sc);bh=Math.ceil(H*sc);
  bcv=mk(bw,bh);bctx=bcv.getContext('2d');bimg=bctx.createImageData(bw,bh);
  buf=bimg.data;buf32=new Uint32Array(buf.buffer);
  // layered stars with temperature colours
  starLayer=mk(W,H);const sg=starLayer.getContext('2d'),cols=['#cfe2ff','#ffffff','#ffe9d0','#ffd0e6'];
  for(let i=0;i<720;i++){sg.globalAlpha=rnd(.15,.8);sg.fillStyle=cols[(Math.random()*4)|0];sg.beginPath();sg.arc(Math.random()*W,Math.random()*H,.3+Math.pow(Math.random(),6)*1.4,0,7);sg.fill()}
  tw=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:rnd(.6,1.9),p:rnd(0,7),s:rnd(.8,2.6),c:cols[(Math.random()*4)|0]}));
  vig=mk(W,H);const vg=vig.getContext('2d'),gr=vg.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.hypot(W,H)*.6);
  gr.addColorStop(0,'rgba(2,0,6,0)');gr.addColorStop(1,'rgba(2,0,6,.8)');vg.fillStyle=gr;vg.fillRect(0,0,W,H);
  bx=W/2;by=Math.min(H*.84,H-100);bR=clamp(Math.min(W,H)*.13,52,100);
}
addEventListener('resize',resize);

// ---------- Galaxy particles (typed arrays) ----------
const R=400,WIND=.0158,N=100000;
const gR=new Float32Array(N),gA=new Float32Array(N),gW=new Float32Array(N),gY=new Float32Array(N),gS=new Float32Array(N);
const cR=new Uint8Array(N),cG=new Uint8Array(N),cB=new Uint8Array(N);
function hsl(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return[f(0)*255,f(8)*255,f(4)*255]}
for(let i=0;i<N;i++){
  const dust=i%7===0,bulge=!dust&&i%11===0,arm=i%3;
  let r=bulge?Math.abs(gauss())*60+8:Math.pow(Math.random(),.85)*R*(dust?1.2:1)+14;
  if(!dust&&!bulge)r=Math.max(10,r+gauss()*34);
  const t=Math.min(1,r/(R*1.2)),spread=dust?Math.PI:(1.05-.3*t),fade=bulge?1:Math.pow(1-t,1.25);
  gR[i]=r;gA[i]=(dust||bulge)?rnd(0,Math.PI*2):r*WIND+arm*Math.PI*2/3+gauss()*spread;
  gW[i]=1.6/(r+40)*14;gY[i]=bulge?gauss()*38:gauss()*((dust?70:46)*Math.pow(1-t,1.2)+12);gS[i]=rnd(.5,dust?1.1:1.5);
  let hue=35-65*Math.min(1,t/.45)+gauss()*8;
  if(bulge)hue=rnd(30,45);else if(t>.45&&Math.random()<.12)hue=rnd(250,285);
  const al=Math.min(1,(rnd(.35,.95)*fade+.02)*1.25),c=hsl((hue%360+360)%360,bulge?70:95-t*10,bulge?90:92-t*40);
  cR[i]=c[0]*al;cG[i]=c[1]*al;cB[i]=c[2]*al;
}

// ---------- Sprites ----------
const HEART=new Path2D();
HEART.moveTo(0,-.3);HEART.bezierCurveTo(0,-.95,-1,-.95,-1,-.3);HEART.bezierCurveTo(-1,.3,-.3,.6,0,1);
HEART.bezierCurveTo(.3,.6,1,.3,1,-.3);HEART.bezierCurveTo(1,-.95,0,-.95,0,-.3);
const heartSp=['#ff4d94','#ff9ecb','#ffffff','#ff2e7e','#ffc2dd'].map(c=>{
  const k=mk(64,64),g=k.getContext('2d');g.translate(32,32);g.scale(28,28);g.fillStyle=c;g.fill(HEART);return k});
function radial(size,stops){const k=mk(size,size),g=k.getContext('2d'),h=size/2,r=g.createRadialGradient(h,h,0,h,h,h);
  stops.forEach(([o,c])=>r.addColorStop(o,c));g.fillStyle=r;g.fillRect(0,0,size,size);return k}
const bgGlow=radial(256,[[0,'rgba(255,90,170,.35)'],[.5,'rgba(150,20,110,.12)'],[1,'rgba(0,0,0,0)']]);
const coreGlow=radial(128,[[0,'rgba(255,240,250,.95)'],[.4,'rgba(255,120,190,.45)'],[1,'rgba(255,60,150,0)']]);

const PAL=[['#ffb86b','#e0527a'],['#ff7eb6','#a8206e'],['#9ad0ff','#5b4fd1'],['#b6ffcf','#1fa37a'],['#ffe27a','#e0782f'],['#d9a8ff','#7a2fd0'],['#ffffff','#8a8aa0'],['#ff6b6b','#8a1c2c']];
const ICONS=['💖','💌','✨','🎵','💍','🚀'];
function planetSprite(p){
  const key=p.data.icon+'|'+p.data.col+'|'+p.data.ring;
  if(p.key===key)return p.spr;
  p.key=key;const k=p.spr=mk(160,160),g=k.getContext('2d'),pal=PAL[p.data.col%PAL.length],r=40;
  const gl=g.createRadialGradient(80,80,r*.8,80,80,80);gl.addColorStop(0,'rgba(255,150,200,.4)');gl.addColorStop(1,'rgba(255,150,200,0)');
  g.fillStyle=gl;g.fillRect(0,0,160,160);
  const ring=h=>{g.strokeStyle=h?'rgba(255,220,240,.9)':'rgba(255,220,240,.7)';g.lineWidth=6;g.beginPath();g.ellipse(80,80,r*1.8,r*.5,-.35,h?0:Math.PI,h?Math.PI:Math.PI*2);g.stroke()};
  if(p.data.ring)ring(false);
  const sg=g.createRadialGradient(80-r*.35,80-r*.4,r*.1,80,80,r);sg.addColorStop(0,pal[0]);sg.addColorStop(1,pal[1]);
  g.fillStyle=sg;g.beginPath();g.arc(80,80,r,0,7);g.fill();
  const sh=g.createRadialGradient(80-r*.45,80-r*.5,r*.15,80,80,r*1.05);
  sh.addColorStop(0,'rgba(255,255,255,.2)');sh.addColorStop(.55,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(10,0,30,.62)');
  g.fillStyle=sh;g.beginPath();g.arc(80,80,r,0,7);g.fill();
  g.strokeStyle='rgba(255,200,230,.35)';g.lineWidth=2;g.beginPath();g.arc(80,80,r-1,0,7);g.stroke();
  if(p.data.icon){g.font='54px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(p.data.icon,80,82)}
  if(p.data.ring)ring(true);
  return k;
}

// ---------- Planets ----------
const defs=[['Our Memories',95,1],['Love Letter',130,0],['Dreams',165,1],['Favorite Songs',200,0],['Promises',235,1],['Next Adventure',270,0]];
let saved=[];try{saved=JSON.parse(localStorage.getItem('galaxy-love-v1')||'[]')}catch(e){}
const planets=defs.map((d,i)=>({
  r:d[1]*1.3,arm:i%3,a0:d[1]*1.3*WIND+(i%3)*Math.PI*2/3+gauss()*.25,w:1.6/(d[1]*1.3+40)*14,size:20,shade:1,
  data:Object.assign({name:d[0],msg:'',imgs:[],icon:ICONS[i],col:i,ring:!!d[2]},saved[i]||{}),sx:0,sy:0,sr:0,d:0,key:'',spr:null}));
function persist(){try{localStorage.setItem('galaxy-love-v1',JSON.stringify(planets.map(p=>p.data)))}catch(e){}}

// ---------- Hearts / streaks / shooting stars / confetti ----------
const hearts=Array.from({length:150},()=>spawn(rnd(60,2600)));
function spawn(z){const a=rnd(0,Math.PI*2),d=rnd(170,1700);return{x:Math.cos(a)*d,y:Math.sin(a)*d,z,s:rnd(14,34),c:(Math.random()*5)|0,p:rnd(0,7)}}
const streaks=Array.from({length:150},()=>({a:rnd(0,7),d:rnd(20,500),c:Math.random()}));
let shoot=[],nextSS=2,confetti=[],ring=null,flashA=0;
const CONF=['#ff4d94','#ffd166','#7ae7ff','#b8ffcf','#d9a8ff','#ffffff'];

// ---------- State ----------
let cyFrac=.5,yaw=0,yawV=0,drag=null,closing=false,phase='bow',t0=0,popT=0,time=0,D=3300,tilt=.3,hSpeed=260,pAlpha=0,gAlpha=0,last=performance.now(),NOW=0;
let pull=null,arrow=null,snap=null,balloon=true;
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2,WARP=6500;
resize();

function setMsg(s){$('msg').textContent=s}

function updateArrow(dt){
  if(!arrow)return;
  const n=6,h=dt/n,cx=W/2,cy=H/2;
  for(let i=0;i<n;i++){
    arrow.vy+=G*h;arrow.x+=arrow.vx*h;arrow.y+=arrow.vy*h;
    const dx=(arrow.x-cx)/(bR*.9),dy=(arrow.y-cy)/(bR*1.07);
    if(dx*dx+dy*dy<1){popBalloon();return}
  }
  arrow.trail.push([arrow.x,arrow.y]);if(arrow.trail.length>16)arrow.trail.shift();
  if(arrow.y>H+140||arrow.y<-140||arrow.x<-140||arrow.x>W+140){arrow=null;setMsg('So close — pull back and try again')}
}
function popBalloon(){
  phase='pop';popT=NOW;balloon=false;arrow=null;flashA=1;ring={r:0};
  $('intro').classList.add('gone');
  for(let i=0;i<120;i++){const a=rnd(0,7),s=rnd(120,780);
    confetti.push({x:W/2,y:H/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-220,rot:rnd(0,7),vr:rnd(-9,9),c:CONF[i%6],w:rnd(5,10),h:rnd(3,6),life:rnd(1.8,3.2),t:0,heart:i%6===0?(Math.random()*5|0):-1})}
}

function frame(now){
  NOW=now;const dt=Math.min(.05,(now-last)/1000);last=now;
  time+=reduce?dt*.4:dt;
  if(phase==='bow')updateArrow(dt);
  if(phase==='pop'&&now-popT>1100){phase='warp';t0=now}
  if(phase==='warp'){
    const u=Math.min(1,(now-t0)/WARP),e=ease(u);
    D=3300+(850-3300)*e;cyFrac=.5+.1*e;tilt=.3+(.38-.3)*e;
    gAlpha=Math.min(1,u*2.4);
    hSpeed=260+1900*Math.sin(Math.PI*Math.min(1,u*1.05));
    pAlpha=Math.max(0,(u-.65)/.35);
    if(u>=1){phase='explore';hSpeed=240;pAlpha=1;gAlpha=1;const h=$('hint');h.classList.add('on');setTimeout(()=>h.classList.remove('on'),5000)}
  }
  if(!drag||!drag.moved){yaw+=yawV;yawV*=.95}
  draw(dt);requestAnimationFrame(frame);
}

function draw(dt){
  const ct=Math.cos(tilt),st=Math.sin(tilt);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.fillStyle='#05000a';ctx.fillRect(0,0,W,H);
  // nebula with gentle parallax
  ctx.globalCompositeOperation='lighter';ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.globalAlpha=.75+.1*Math.sin(time*.4);
  ctx.drawImage(nebula,-W*.125+Math.sin(yaw*.5)*W*.06,-H*.125+(tilt-.3)*H*.12,W*1.25,H*1.25);
  ctx.globalAlpha=1;ctx.drawImage(starLayer,0,0);
  for(const s of tw){const a=.3+.7*(.5+.5*Math.sin(time*s.s+s.p));ctx.globalAlpha=a;ctx.fillStyle=s.c;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
    if(s.r>1.4){ctx.fillRect(s.x-s.r*4*a,s.y-.4,s.r*8*a,.8);ctx.fillRect(s.x-.4,s.y-s.r*4*a,.8,s.r*8*a)}}
  // shooting stars
  if(time>nextSS&&!reduce){nextSS=time+rnd(3,7);shoot.push({x:rnd(W*.3,W*1.05),y:rnd(0,H*.35),vx:-rnd(600,900),vy:rnd(220,380),t:0,life:rnd(.6,1)})}
  for(let i=shoot.length-1;i>=0;i--){const s=shoot[i];s.t+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(s.t>s.life){shoot.splice(i,1);continue}
    const m=Math.hypot(s.vx,s.vy),tx=s.x-s.vx/m*140,ty=s.y-s.vy/m*140,gr=ctx.createLinearGradient(s.x,s.y,tx,ty);
    gr.addColorStop(0,'rgba(255,240,250,.9)');gr.addColorStop(1,'rgba(255,150,200,0)');
    ctx.globalAlpha=Math.sin(Math.PI*s.t/s.life);ctx.strokeStyle=gr;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(tx,ty);ctx.stroke()}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

  const cx=W/2,cy=H*cyFrac,ck=F/D;
  if(gAlpha>.01){
    ctx.globalAlpha=gAlpha;const bgR=R*ck*1.4;ctx.drawImage(bgGlow,cx-bgR,cy-bgR,bgR*2,bgR*2);ctx.globalAlpha=1;
  }

  // planets
  const back=[],front=[];
  if(pAlpha>0){
    for(const p of planets){
      const a=p.a0+time*p.w+yaw,x=Math.cos(a)*p.r,z=Math.sin(a)*p.r;
      const dd=z*ct+D,k=F/dd,ratio=k/ck;
      p.sx=cx+x*k;p.sy=cy+(-z*st)*k+Math.sin(time*1.3+p.r)*3*k;p.d=dd;
      p.sr=p.size*k*Math.max(.5,Math.min(1.15,Math.pow(ratio,2)));
      p.shade=Math.max(.45,Math.min(1,.7+(ratio-1)*3));
      (dd>D?back:front).push(p);
    }
    back.sort((a,b)=>b.d-a.d);front.sort((a,b)=>b.d-a.d);
    for(const p of back)drawPlanet(p);
  }

  if(gAlpha>.01){
    buf32.fill(0xFF000000);
    for(let i=0;i<N;i++){
      const a=gA[i]+time*gW[i]+yaw,r=gR[i],y=gY[i],z=Math.sin(a)*r;
      const d=y*st+z*ct+D;if(d<20)continue;
      const k=F/d,px=((cx+Math.cos(a)*r*k)*sc)|0,py=((cy+(y*ct-z*st)*k)*sc)|0;
      const s=Math.max(1,Math.round(gS[i]*k*1.3*sc));
      const x1=Math.min(bw,px+s),y1=Math.min(bh,py+s),r8=cR[i],g8=cG[i],b8=cB[i];
      for(let yy=Math.max(0,py);yy<y1;yy++){let o=(yy*bw+Math.max(0,px))*4;
        for(let xx=Math.max(0,px);xx<x1;xx++,o+=4){buf[o]+=r8;buf[o+1]+=g8;buf[o+2]+=b8}}
    }
    bctx.putImageData(bimg,0,0);
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=gAlpha;ctx.drawImage(bcv,0,0,W,H);
    // cheap bloom: soft oversized second pass
    ctx.globalAlpha=gAlpha*.35;const bl=1.06;ctx.drawImage(bcv,cx-cx*bl,cy-cy*bl,W*bl,H*bl);
    const cr=48*ck*(1+.04*Math.sin(time*1.6));ctx.globalAlpha=gAlpha;ctx.drawImage(coreGlow,cx-cr,cy-cr,cr*2,cr*2);
    drawHole(cx,cy,ck,st,ct);
    ctx.globalAlpha=1;
  }
  for(const p of front)drawPlanet(p);

  // warp streaks
  const inten=phase==='warp'?clamp((hSpeed-300)/1500,0,1):0;
  if(inten>.02){
    ctx.globalCompositeOperation='lighter';ctx.lineWidth=1.3;const mx=Math.hypot(W,H)*.6;
    for(const s of streaks){
      s.d+=s.d*dt*3.2*inten+dt*30;if(s.d>mx){s.d=rnd(10,60);s.a=rnd(0,7)}
      const c=Math.cos(s.a),sn=Math.sin(s.a),e=s.d*(1+.28*inten);
      ctx.strokeStyle=s.c>.5?'rgba(255,170,215,1)':'rgba(190,210,255,1)';ctx.globalAlpha=.55*inten*Math.min(1,s.d/120);
      ctx.beginPath();ctx.moveTo(cx+c*s.d,cy+sn*s.d);ctx.lineTo(cx+c*e,cy+sn*e);ctx.stroke()}
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  }

  // hearts
  const am=phase==='explore'?.4:phase==='warp'?.9:.45;
  for(let i=0;i<hearts.length;i++){
    const h=hearts[i];h.z-=hSpeed*dt;
    if(h.z<40){hearts[i]=spawn(rnd(2300,2700));continue}
    const k=F/h.z,x=cx+(h.x+Math.sin(time*.9+h.p)*30)*k,y=H/2+h.y*k,s=h.s*k;
    if(x<-s*2||x>W+s*2||y<-s*2||y>H+s*2){if(h.z<600)hearts[i]=spawn(rnd(2300,2700));continue}
    ctx.globalAlpha=am*Math.min(1,h.z/250)*Math.min(1,(2700-h.z)/300)*(.75+.25*Math.sin(time*2+h.p));
    const q=s*64/28;ctx.drawImage(heartSp[h.c],x-q/2,y-q/2,q,q);
  }
  ctx.globalAlpha=1;

  // intro scene
  if(balloon&&(phase==='bow'))drawBalloon();
  const bowA=phase==='bow'?1:phase==='pop'?Math.max(0,1-(NOW-popT)/500):0;
  if(bowA>0){ctx.globalAlpha=bowA;drawBow();ctx.globalAlpha=1}
  drawFX(dt);
  ctx.globalAlpha=1;ctx.drawImage(vig,0,0);
}

function drawHole(cx,cy,ck,st,ct){
  const rh=34*ck,rs=reduce?.4:1,hasC=typeof ctx.createConicGradient==='function';
  ctx.globalAlpha=gAlpha;ctx.globalCompositeOperation='source-over';
  let g=ctx.createRadialGradient(cx,cy,rh*.9,cx,cy,rh*3.2);g.addColorStop(0,'rgba(2,0,6,.92)');g.addColorStop(1,'rgba(2,0,6,0)');
  ctx.fillStyle=g;ctx.fillRect(cx-rh*3.2,cy-rh*3.2,rh*6.4,rh*6.4);
  ctx.globalCompositeOperation='lighter';
  const disk=front=>{ctx.save();ctx.translate(cx,cy);ctx.scale(1,Math.max(.12,st));ctx.beginPath();ctx.rect(-rh*6,front?0:-rh*6,rh*12,rh*6);ctx.clip();
    for(let i=0;i<16;i++){const t=i/15,a=Math.pow(1-t,1.1)*.6,col='hsla('+(40-75*t)+',100%,'+(90-42*t)+'%,';let s;
      if(hasC){s=ctx.createConicGradient(time*rs*(2.4-1.8*t)+i,0,0);s.addColorStop(0,col+a+')');s.addColorStop(.25,col+a*.2+')');s.addColorStop(.5,col+a*.9+')');s.addColorStop(.75,col+a*.15+')');s.addColorStop(1,col+a+')')}
      else s=col+a*.6+')';
      ctx.strokeStyle=s;ctx.lineWidth=rh*.2;ctx.beginPath();ctx.arc(0,0,rh*(1.3+t*2.5),0,7);ctx.stroke()}
    ctx.restore()};
  disk(false);
  ctx.globalCompositeOperation='source-over';
  g=ctx.createRadialGradient(cx-rh*.3,cy-rh*.35,rh*.05,cx,cy,rh);g.addColorStop(0,'#2a0f3c');g.addColorStop(.5,'#050008');g.addColorStop(1,'#000');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,rh,0,7);ctx.fill();
  ctx.globalCompositeOperation='lighter';
  ctx.shadowColor='rgba(255,140,200,.9)';ctx.shadowBlur=rh*.6;
  g=ctx.createLinearGradient(cx-rh,cy-rh,cx+rh,cy+rh);g.addColorStop(0,'rgba(255,240,230,.95)');g.addColorStop(1,'rgba(255,90,170,.5)');
  ctx.strokeStyle=g;ctx.lineWidth=Math.max(1,rh*.07);ctx.beginPath();ctx.arc(cx,cy,rh*1.02,0,7);ctx.stroke();ctx.shadowBlur=0;
  for(const[rr,sy,a0,a1,al]of[[1.45,.7+.3*ct,Math.PI,Math.PI*2,.55],[1.3,.55,0,Math.PI,.2]]){
    ctx.save();ctx.translate(cx,cy);ctx.scale(1,sy);const lg=ctx.createLinearGradient(-rh*2,0,rh*2,0);
    lg.addColorStop(0,'rgba(255,110,180,'+al+')');lg.addColorStop(.5,'rgba(255,235,215,'+al+')');lg.addColorStop(1,'rgba(255,160,100,'+al+')');
    ctx.strokeStyle=lg;ctx.lineWidth=rh*.28;ctx.beginPath();ctx.arc(0,0,rh*rr,a0,a1);ctx.stroke();ctx.restore()}
  disk(true);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
}
function drawBalloon(){
  const x=W/2,y=H/2,r=bR,rx=r*.88,ry=r*1.07;
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.55;ctx.drawImage(bgGlow,x-r*2.4,y-r*2.4,r*4.8,r*4.8);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(time*1.3)*.035);const s=1+.02*Math.sin(time*2.2);ctx.scale(s,s);
  ctx.strokeStyle='rgba(255,230,240,.6)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,ry+9);
  ctx.quadraticCurveTo(Math.sin(time+1)*18,ry+55,Math.sin(time*1.7)*14,ry+115);ctx.stroke();
  const g=ctx.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r*1.25);
  g.addColorStop(0,'#ffb3d6');g.addColorStop(.45,'#ff3d88');g.addColorStop(1,'#8e0f55');
  ctx.fillStyle=g;ctx.shadowColor='rgba(255,60,150,.7)';ctx.shadowBlur=30;
  ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,7);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#c2185b';ctx.beginPath();ctx.moveTo(0,ry-3);ctx.lineTo(-8,ry+10);ctx.lineTo(8,ry+10);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(-r*.38,-r*.5,r*.13,r*.26,-.5,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.95)';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`italic ${Math.round(r*.27)}px Georgia,serif`;ctx.fillText('Happy',0,-r*.08);ctx.fillText('Birthday',0,r*.2);
  ctx.restore();
}
function arrowShape(px,py,tx,ty){
  const dx=tx-px,dy=ty-py,l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l,nx=-uy,ny=ux;
  ctx.lineCap='round';ctx.strokeStyle='#ffe9c9';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(tx,ty);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(tx+ux*14,ty+uy*14);ctx.lineTo(tx+nx*5.5,ty+ny*5.5);ctx.lineTo(tx-nx*5.5,ty-ny*5.5);ctx.fill();
  ctx.strokeStyle='#ff4d94';ctx.lineWidth=2.5;
  for(const i of[0,7,14]){const bx0=px+ux*(4+i*.9),by0=py+uy*(4+i*.9);
    ctx.beginPath();ctx.moveTo(bx0,by0);ctx.lineTo(bx0-ux*8+nx*6,by0-uy*8+ny*6);ctx.moveTo(bx0,by0);ctx.lineTo(bx0-ux*8-nx*6,by0-uy*8-ny*6);ctx.stroke()}
}
function drawBow(){
  let dx=0,dy=-1,len=0,pvx=0,pvy=0;
  if(pull){len=Math.hypot(pull.x,pull.y);pvx=pull.x;pvy=pull.y;if(len>6){dx=-pull.x/len;dy=-pull.y/len}}
  else if(snap){const a=time-snap.t;if(a<.4){const k=Math.cos(a*50)*Math.exp(-a*9)*.3;pvx=snap.pv.x*k;pvy=snap.pv.y*k}}
  const nx=-dy,ny=dx,back=len*.22,t1x=bx+nx*78-dx*back,t1y=by+ny*78-dy*back,t2x=bx-nx*78-dx*back,t2y=by-ny*78-dy*back;
  const cxp=bx+dx*(62-len*.1),cyp=by+dy*(62-len*.1),px=bx+pvx,py=by+pvy;
  // aim guide
  if(len>10&&!arrow){
    const sp=500+len/L*1100,vx=dx*sp,vy=dy*sp,sx=bx+dx*48,sy=by+dy*48;
    ctx.fillStyle='#ffd1e6';
    for(let i=1;i<=14;i++){const t=i*.04;ctx.globalAlpha=.7*(1-i/15);ctx.beginPath();ctx.arc(sx+vx*t,sy+vy*t+.5*G*t*t,2.4,0,7);ctx.fill()}
    ctx.globalAlpha=1;
  }
  ctx.shadowColor='rgba(255,120,180,.9)';ctx.shadowBlur=14;ctx.lineCap='round';
  ctx.strokeStyle='#ffcf8a';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(t1x,t1y);ctx.quadraticCurveTo(cxp,cyp,t2x,t2y);ctx.stroke();
  ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(t1x,t1y);ctx.lineTo(px,py);ctx.lineTo(t2x,t2y);ctx.stroke();
  if(!arrow)arrowShape(px,py,bx+dx*48,by+dy*48);
}
function drawFX(dt){
  if(arrow){
    ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
    for(let i=1;i<arrow.trail.length;i++){ctx.strokeStyle='rgba(255,150,200,1)';ctx.globalAlpha=i/arrow.trail.length*.6;ctx.lineWidth=i/4;
      ctx.beginPath();ctx.moveTo(arrow.trail[i-1][0],arrow.trail[i-1][1]);ctx.lineTo(arrow.trail[i][0],arrow.trail[i][1]);ctx.stroke()}
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    const m=Math.hypot(arrow.vx,arrow.vy),ux=arrow.vx/m,uy=arrow.vy/m;arrowShape(arrow.x-ux*90,arrow.y-uy*90,arrow.x,arrow.y);
  }
  if(flashA>.01){
    ctx.globalCompositeOperation='lighter';const Rf=Math.max(W,H)*.7*(1.4-flashA*.4);ctx.globalAlpha=flashA;
    ctx.drawImage(coreGlow,W/2-Rf,H/2-Rf,Rf*2,Rf*2);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';flashA*=Math.pow(.02,dt);
  }
  if(ring){ring.r+=dt*Math.max(W,H)*1.1;const a=1-ring.r/(Math.max(W,H)*.6);
    if(a<=0)ring=null;else{ctx.strokeStyle='rgba(255,190,225,'+a+')';ctx.lineWidth=3+a*8;ctx.beginPath();ctx.arc(W/2,H/2,ring.r,0,7);ctx.stroke()}}
  for(let i=confetti.length-1;i>=0;i--){
    const c=confetti[i];c.t+=dt;if(c.t>c.life){confetti.splice(i,1);continue}
    c.vy+=500*dt;c.vx*=1-1.6*dt;c.vy*=1-.7*dt;c.x+=c.vx*dt+Math.sin(c.t*6+c.rot)*.6;c.y+=c.vy*dt;c.rot+=c.vr*dt;
    ctx.globalAlpha=Math.min(1,(c.life-c.t)/.6);ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);
    if(c.heart>=0)ctx.drawImage(heartSp[c.heart],-9,-9,18,18);
    else{ctx.fillStyle=c.c;ctx.scale(1,Math.cos(c.t*8+c.rot));ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h)}
    ctx.restore()}
  ctx.globalAlpha=1;
}

function drawPlanet(p){
  const spr=planetSprite(p),q=p.sr/40*160,x=p.sx,y=p.sy,r=p.sr;
  ctx.globalAlpha=pAlpha*p.shade;
  ctx.globalCompositeOperation='lighter';const pg=r*3.2*(1+.05*Math.sin(time*2+p.r));ctx.globalAlpha=pAlpha*p.shade*.25;ctx.drawImage(bgGlow,x-pg/2,y-pg/2,pg,pg);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=pAlpha*p.shade;
  ctx.drawImage(spr,x-q/2,y-q/2,q,q);
  if(p.data.msg||p.data.imgs.length){const b=r*.9*(1+.08*Math.sin(time*3));ctx.drawImage(heartSp[2],x+r*.6,y-r*1.4,b,b)}
  ctx.fillStyle='rgba(255,235,245,.92)';ctx.font=`italic ${Math.max(10,Math.min(14,r*.5))}px Georgia,serif`;ctx.textAlign='center';
  ctx.fillText(p.data.name,x,y+r*1.5+10);
  ctx.globalAlpha=1;
}

// ---------- Bow pull / swipe + tap ----------
let cur=null;
function release(){
  const l=Math.hypot(pull.x,pull.y);
  if(l>24){const ux=-pull.x/l,uy=-pull.y/l,sp=500+l/L*1100;
    arrow={x:bx+ux*48,y:by+uy*48,vx:ux*sp,vy:uy*sp,trail:[]};snap={pv:{x:pull.x,y:pull.y},t:time};setMsg('Pull the bow back, aim at the balloon, let go')}
  pull=null;
}
cv.addEventListener('pointerdown',e=>{
  if(closing)return;
  if(phase==='bow'){if(arrow)return;pull={sx:e.clientX,sy:e.clientY,x:0,y:0};try{cv.setPointerCapture(e.pointerId)}catch(_){}return}
  if(phase!=='explore')return;
  drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:false};
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(pull){let vx=e.clientX-pull.sx,vy=e.clientY-pull.sy;const l=Math.hypot(vx,vy);if(l>L){vx*=L/l;vy*=L/l}pull.x=vx;pull.y=vy;return}
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8)drag.moved=true;
  if(drag.moved){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;yaw+=dx*.008;yawV=dx*.008;tilt=Math.max(.12,Math.min(1.25,tilt+dy*.004))}
  drag.x=e.clientX;drag.y=e.clientY;
});
function endDrag(e,cancel){
  if(pull){if(cancel)pull=null;else release();return}
  if(!drag)return;const d=drag;drag=null;if(d.moved||cancel)return;
  let best=null,bd=1e9;
  for(const p of planets){const dd=Math.hypot(e.clientX-p.sx,e.clientY-p.sy);if(dd<p.sr+26&&dd<bd){best=p;bd=dd}}
  if(best)openPlanet(best);
}
cv.addEventListener('pointerup',e=>endDrag(e,false));
cv.addEventListener('pointercancel',e=>endDrag(e,true));

// ---------- Planet card ----------
function openPlanet(p){
  cur=p;$('pname').value=p.data.name;$('pmsg').value=p.data.msg;
  $('picon').value=p.data.icon||'';$('pring').checked=!!p.data.ring;renderSw();renderGrid();
  $('modal').classList.add('open');
  const card=document.querySelector('.card'),r=card.getBoundingClientRect(),ms=reduce?0:1;
  const dx=p.sx-(r.left+r.width/2),dy=p.sy-(r.top+r.height/2);
  $('modal').animate([{opacity:0},{opacity:1}],{duration:320*ms});
  card.animate([{transform:`translate(${dx}px,${dy}px) scale(.04)`,opacity:0},{opacity:1,offset:.35},{transform:'none',opacity:1}],{duration:560*ms,easing:'cubic-bezier(.2,.85,.25,1)'});
}
function renderGrid(){
  const g=$('grid');g.innerHTML='';
  cur.data.imgs.forEach((src,i)=>{
    const d=document.createElement('div'),im=document.createElement('img'),b=document.createElement('button');
    im.src=src;im.alt='Photo '+(i+1);b.textContent='×';b.setAttribute('aria-label','Remove photo');
    b.onclick=()=>{cur.data.imgs.splice(i,1);persist();renderGrid()};d.append(im,b);g.append(d);
  });
}
function renderSw(){
  const w=$('sw');w.innerHTML='';
  PAL.forEach((c,i)=>{const b=document.createElement('button');
    b.style.background=`linear-gradient(135deg,${c[0]},${c[1]})`;b.setAttribute('aria-label','Color '+(i+1));
    if(cur.data.col===i)b.className='on';b.onclick=()=>{cur.data.col=i;persist();renderSw()};w.append(b)});
}
$('picon').oninput=e=>{cur.data.icon=Array.from(e.target.value).slice(-1)[0]||'';e.target.value=cur.data.icon;persist()};
$('pring').onchange=e=>{cur.data.ring=e.target.checked;persist()};
$('pname').oninput=e=>{cur.data.name=e.target.value||'Planet';persist()};
$('pmsg').oninput=e=>{cur.data.msg=e.target.value;persist()};
$('pimg').onchange=e=>{
  for(const f of e.target.files){
    const rd=new FileReader();
    rd.onload=()=>{const im=new Image();im.onload=()=>{
      const m=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=im.width*m;c.height=im.height*m;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      cur.data.imgs.push(c.toDataURL('image/jpeg',.8));persist();renderGrid();
    };im.src=rd.result};
    rd.readAsDataURL(f);
  }
  e.target.value='';
};
function closeModal(){
  if(!cur||closing)return;closing=true;
  const p=cur,card=document.querySelector('.card'),r=card.getBoundingClientRect(),ms=reduce?0:1;
  const dx=p.sx-(r.left+r.width/2),dy=p.sy-(r.top+r.height/2);
  $('modal').animate([{opacity:1},{opacity:0}],{duration:360*ms,fill:'forwards'});
  const an=card.animate([{transform:'none',opacity:1},{opacity:0,offset:.7},{transform:`translate(${dx}px,${dy}px) scale(.04)`,opacity:0}],{duration:380*ms,easing:'cubic-bezier(.6,0,.8,.4)',fill:'forwards'});
  an.onfinish=()=>{$('modal').getAnimations().forEach(x=>x.cancel());card.getAnimations().forEach(x=>x.cancel());$('modal').classList.remove('open');cur=null;closing=false};
}
$('close').onclick=closeModal;
$('modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal')closeModal()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
requestAnimationFrame(frame);
</script>
